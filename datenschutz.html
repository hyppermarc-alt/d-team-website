    .gate button { cursor: pointer; font-family: var(--text); font-size: 1.0625rem; }
    .gate button:disabled { opacity: .7; cursor: progress; }
    .gate-error { margin: 1rem 0 0; color: #ff8a9b; font-weight: 600; }
