  <style>
    .gate { min-height: 100vh; min-height: 100dvh; display: flex; flex-direction: column; justify-content: center; padding-top: 3rem; }
    .gate .wrap { width: 100%; }
    .gate-auto .gate-inner { visibility: hidden; }
    .gate-brand { margin: 0 0 1.5rem; font-family: var(--display); font-weight: 700; font-size: clamp(3.5rem, 14vw, 7rem); line-height: .9; }
    .gate h1 { max-width: 22ch; margin: 0 0 2rem; font-size: clamp(1.35rem, 2.6vw, 1.75rem); font-weight: 700; font-stretch: 90%; line-height: 1.25; }
    .gate label { display: block; margin-bottom: .4rem; font-weight: 600; font-stretch: 87.5%; }
    .gate-row { display: flex; flex-wrap: wrap; gap: .75rem; max-width: 34rem; }
    .gate input { flex: 1 1 14rem; min-height: 48px; padding: .6rem .9rem; border: 2px solid var(--bone); border-radius: 0; background: #000; color: var(--bone); font: 500 1.0625rem/1.2 var(--text); }
    .gate input:focus-visible { outline: 3px solid var(--stripe); outline-offset: 2px; }
    .gate button { cursor: pointer; font-family: var(--text); font-size: 1.0625rem; }
    .gate button:disabled { opacity: .7; cursor: progress; }
    .gate-error { margin: 1rem 0 0; color: #ff8a9b; font-weight: 600; }
    .gate .van-side { margin-top: clamp(3rem, 8vw, 6rem); }
  </style>
</head>

      <h1>Diese Vorschau ist passwortgeschützt.</h1>
      <form id="gate-form">
        <label for="gate-pw">Passwort</label>
        <div class="gate-row">
          <input id="gate-pw" name="password" type="password" autocomplete="current-password" required>
          <button class="btn btn--red" type="submit">Seite öffnen</button>
        </div>
        <p class="gate-error" id="gate-error" role="alert" hidden>Das Passwort stimmt nicht. Bitte noch einmal versuchen.</p>
      </form>
      <noscript><p>Zum Öffnen der Seite wird JavaScript benötigt.</p></noscript>
    </div>
    <div class="van-side" aria-hidden="true">
      <svg class="stripe" viewBox="0 0 1440 110" preserveAspectRatio="none" focusable="false">
        <path d="M0 88 H1088 L1262 0 H1440 V22 H1286 L1112 110 H0 Z"/>
      </svg>
      <div class="rocker"></div>
    </div>
  </main>
